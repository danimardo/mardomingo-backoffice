# Integración continua (Historias.md 15.26; constitución, «Puertas del CI»). Se ejecuta en cada PR y en cada push
# a `main` y `staging`. Las diez puertas van en este orden y todas son bloqueantes.
name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.21.0
  PNPM_VERSION: 12.8.1

jobs:
  gates:
    name: diez puertas
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Caché de pnpm y de navegadores
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pnpm-pw-${{ hashFiles('pnpm-lock.yaml') }}

      # 1. Dependencias exactas, sin modificar el lockfile.
      - name: 1. Instalar dependencias
        run: pnpm install --frozen-lockfile

      # ffmpeg y ffprobe: la transcripción y la suite HTTP de medios los usan (L08). No vienen garantizados en la imagen.
      - name: 1. Instalar ffmpeg y ffprobe
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg && ffmpeg -version | head -1 && ffprobe -version | head -1

      # Mensajes de Paraglide (src/lib/paraglide, ignorado por git): sin ellos el lint no ve los tipos de `m`.
      - name: 2. Compilar mensajes
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      # 2. Lint completo (Prettier y ESLint sin avisos).
      - name: 2. Lint
        run: pnpm lint

      # 3. Tipos y avisos de Svelte.
      - name: 3. Check
        run: pnpm check

      # La documentación de la API (docs/api, la usa Secretario) debe coincidir con el código. Si cambió una ruta y no se
      # regeneró, el paso falla y dice qué ejecutar.
      - name: 3. Documentación de la API al día
        run: |
          pnpm docs:api
          if ! git diff --quiet -- docs/api; then
            echo "docs/api no coincide con el código. Ejecuta 'pnpm docs:api' y commitea docs/api."
            git diff -- docs/api | head -60
            exit 1
          fi

      # 4. Pruebas unitarias, de componente e integración con cobertura y umbrales.
      - name: 4. Cobertura
        run: pnpm test:coverage

      - name: 4. Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

      # 5. Pruebas HTTP contra el build.
      - name: 5. HTTP
        run: pnpm test:http

      # 6. E2E en Chromium contra el build (Firefox y WebKit si la PR toca formularios, foco, descargas, subidas o CSS global).
      - name: 6. Detectar cambios sensibles
        id: sensible
        run: |
          if git diff --name-only "origin/${GITHUB_BASE_REF:-main}...HEAD" 2>/dev/null | grep -Eq '(^src/routes/|^src/lib/components/|^src/app\.css$|^src/lib/design-system/)'; then
            echo "navegadores=todos" >> "$GITHUB_OUTPUT"
          else
            echo "navegadores=chromium" >> "$GITHUB_OUTPUT"
          fi

      - name: 6. Instalar navegadores
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: 6. Build para E2E
        run: pnpm build

      - name: 6. E2E smoke, crítico y accesibilidad (Chromium)
        run: pnpm exec playwright test --project=chromium --grep "@smoke|@critical|@a11y|accesible|apariencia"

      - name: 6. E2E en Firefox
        if: steps.sensible.outputs.navegadores == 'todos'
        run: pnpm exec playwright test --project=firefox

      # WebKit se ejecuta y se informa, pero no bloquea (decisión del propietario, 2026-10-14): sus fallos en Linux (login,
      # teclado, contraste en oscuro) están pendientes de investigar; el resultado queda en los artefactos.
      - name: 6. E2E en WebKit (informativo, no bloquea)
        id: webkit
        if: steps.sensible.outputs.navegadores == 'todos'
        continue-on-error: true
        run: pnpm exec playwright test --project=webkit --project=mobile-webkit

      # Specs que cambian la base entera: cada uno en su paso, con base nueva (publicar una versión legal y activar el
      # mantenimiento afectan a todas las cuentas). Incluyen el `@critical` de la aceptación legal sin JavaScript (T288, T322).
      - name: 6. E2E de aceptación legal (crítico 7 y 10)
        run: pnpm exec playwright test --project=setup --project=legal-critico7 --no-deps

      - name: 6. E2E de cierre de administración
        run: pnpm exec playwright test --project=setup --project=admin-cierre --no-deps

      - name: 6. Artefactos de fallo
        if: failure() || steps.webkit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fallos
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # 7. Build sin variables secretas y build de la imagen.
      - name: 7. Build sin secretos
        run: pnpm build

      - name: 7. Imagen Docker
        run: docker build --tag mardomingo-backoffice:ci .

      # 8. Auditoría de dependencias de producción: sin altas ni críticas.
      - name: 8. Auditoría
        run: pnpm audit --prod --audit-level high

      # 9. Esquema de la BD: sin cambios pendientes.
      - name: 9. Migraciones sin cambios pendientes
        env:
          DATABASE_PATH: ci-check.db
        run: |
          pnpm db:check
          pnpm db:generate
          git diff --exit-code -- drizzle

      # 10. Sin colores literales fuera de los tokens.
      - name: 10. Tokens
        run: pnpm lint:tokens
