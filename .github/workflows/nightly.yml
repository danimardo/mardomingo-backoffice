# Nocturna (Historias.md 15.26): matriz de tres navegadores y mobile-webkit, con vídeo de los fallos.
# E2E_NIGHTLY=1 activa la matriz completa de UX (16.11, `ux-matrix-nocturna.spec.ts`, T357). `appearance.spec.ts` (T359),
# `ux-matrix.spec.ts` (T358) y las specs a11y corren en cada proyecto sin filtro. El trabajo visual no va aquí: solo en el
# contenedor oficial de Playwright.
name: nocturna

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0
  PNPM_VERSION: 12.8.1
  E2E_NIGHTLY: '1'

jobs:
  matriz:
    name: E2E ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project == 'mobile-webkit' && 'webkit' || matrix.project }}
      - run: pnpm build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      # Estado de la matriz de UX (16.11) en cada noche, también en verde (T365). Lo escribe `e2e/fixtures/ux-emulation.ts`.
      - name: Estado de UX (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-status-${{ matrix.project }}
          path: test-results/ux-status.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Artefactos (vídeo y trazas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nocturna-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # Specs que cambian la base entera (publicar una versión legal, mantenimiento, reembolso): cada uno en su trabajo, con base
  # nueva y solo su proyecto y el de `setup` (`--no-deps`), como se verifica en local (T288, T322).
  final:
    name: E2E ${{ matrix.project }} (final)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [legal-critico7, admin-cierre]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test --project=setup --project=${{ matrix.project }} --no-deps
      - name: Artefactos (vídeo y trazas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nocturna-final-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
